name: Release
run-name: Release @ Aegis Icons - ${{ github.sha }}

on:
  schedule:
    - cron: "0 0 1 * *"   # 00:00 UTC on the 1st of each month
  workflow_dispatch:

env:
  zipname: aegis-icons.zip

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Get current date
        run: |
          echo "DATE_ISO=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "DATE_INT=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Execute py script (gen-def)
        run: python make-pack.py gen-def

      - name: Commit json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update pack.json

      - name: Execute py script (generate ZIP)
        run: python make-pack.py gen --output ${{ env.zipname }} --version ${{ env.DATE_INT }}

      # -------------------------------
      # Build release notes
      # -------------------------------
      # The previous changelog generation relied on PR labels via
      # mikepenz/release-changelog-builder-action and a fragile git-diff
      # script. Both were commented out and the workflow fell back to a
      # hardcoded "Release notes coming soon." placeholder.
      #
      # We now use GitHub's own release-notes engine
      # (POST /releases/generate-notes). Because merged icon PRs follow the
      # "New icon: ..." / "Update icon: ..." title convention, the generated
      # "## What's Changed" list matches the desired format:
      #   * New icon: Duitku by @partingscientist in #1021
      - name: Generate Release Notes
        run: python generate-release-notes.py
        env:
          RELEASE_TAG: ${{ env.DATE_ISO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a GitHub release
        uses: softprops/action-gh-release@v0.1.15
        with:
          files: ${{ env.zipname }}
          name: ${{ env.DATE_ISO }}
          tag_name: ${{ env.DATE_ISO }}
          body_path: release_notes.md

